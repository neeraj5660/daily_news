<!doctype html>
<html><head><meta charset="utf-8"><title>Archive — The Morning Desk</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Inter,Arial;background:#0B1220;color:#F6F3EC;padding:24px}a{color:#E8A33D}</style></head><body>
  <h1>Archive — The Morning Desk</h1>
  <p>This page lists historical snapshots of data.json generated by fetch_data.py.</p>
  <div id="list">Loading…</div>
  <script>
    async function load(){
      try{
        const r = await fetch('/archive_index.json');
        const list = r.ok ? await r.json() : [];
        const el = document.getElementById('list');
        if (!list.length) { el.innerHTML = '<p>No archive entries found.</p>'; return; }
        el.innerHTML = '<ul>' + list.map(it => `<li><strong>${it.updated_at || ''}</strong> — ${it.title || ''} — <a href="/${it.file}">${it.file}</a></li>`).join('\n') + '</ul>';
      } catch(e){ document.getElementById('list').textContent = 'Failed to load archive'; }
    }
    load();
  </script>
</body></html>
