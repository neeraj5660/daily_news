name: Update Morning Desk data

on:
  schedule:
    # every 30 min, 03:00-11:00 UTC = roughly 08:30-16:30 IST (market hours + pre/post)
    - cron: "*/30 3-11 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python fetch_data.py

      - name: Commit updated data.json
        run: |
          git config user.name "morning-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Auto-update market data"
          git push
